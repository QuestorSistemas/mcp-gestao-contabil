[project]
name = "gestao-contabil-mcp"
version = "0.3.1-beta"
description = "Servidor MCP para a API nHttp do Questor Gestão Contábil"
requires-python = ">=3.10"
# Teto de versão obrigatório: o mcp 2.x renomeou FastMCP para MCPServer e o
# servidor não importa mais. Sem o teto, uma instalação nova baixa a 2.x.
# Piso 1.25: abaixo disso o mcp quebra com o pydantic atual (eval_type_backport).
dependencies = [
    "mcp>=1.25,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gestao-contabil-mcp = "server:main"
gestao-contabil-mcp-setup = "setup_config:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "client", "setup_config", "atualizacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
